name: Code

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust format, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # Warnings are allowed until the existing stylistic backlog is cleared.
      - run: cargo clippy --workspace --all-targets
      # Platform integration tests need Docker Postgres/Neo4j and a .env, so CI runs unit tests only.
      - run: cargo test --workspace --lib

  pins:
    name: Supply-chain pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Standard library only: image digests, tool hashes and action SHAs, offline.
      - run: python3 scripts/check-pins.py
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_check_pins.py' -v
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_download_pins.py' -v

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
