[workspace]
members = ["crates/protocol", "crates/server", "crates/agent", "crates/mcp-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "derive"] }
# The value-type features (uuid, chrono, json) are enabled on the driver crates
# directly, not through the sqlx facade. The facade spells them `sqlx-sqlite?/uuid`
# and so on, and Cargo's lockfile resolver then admits sqlx-sqlite, whose
# libsqlite3-sys ^0.30 conflicts with rusqlite 0.33 and later (both `links = "sqlite3"`).
# SQLite is never built. sqlx 0.9 still accepts only libsqlite3-sys <0.38, so keep
# this split (or hold rusqlite at 0.39) when moving to it.
sqlx-core = { version = "0.8", default-features = false, features = ["uuid", "chrono", "json"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
recollect-protocol = { path = "crates/protocol" }

# Argon2id at the ADR 0024 cost is far too slow unoptimized; build only the
# hashing crates with optimization so debug builds and tests sign in quickly.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
