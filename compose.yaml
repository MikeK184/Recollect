# Development-stack override of infra/product/compose.yaml. Run it through
# ./scripts/stack.sh (or ./scripts/docker.sh compose with both -f files, which the
# COMPOSE_FILE line written to .env by ./scripts/setup-local.sh also selects).
name: recollect

# Deliberate allowlist: never pass the entire .env or the host environment.
x-runtime: &runtime
  DATABASE_URL: postgres://recollect_app:${RECOLLECT_DB_PASSWORD:?Run ./scripts/setup-local.sh}@postgres:5432/recollect
  RECOLLECT_OWNER_USERNAME: ${RECOLLECT_OWNER_USERNAME:-owner}
  RECOLLECT_OWNER_PASSWORD: ${RECOLLECT_OWNER_PASSWORD:?Run ./scripts/setup-local.sh}
  RECOLLECT_BIND: 0.0.0.0:8787
  RECOLLECT_PUBLIC_ORIGIN: ${RECOLLECT_PUBLIC_ORIGIN:-http://127.0.0.1:8787}
  RECOLLECT_STATIC_DIR: /opt/recollect/web
  NEO4J_URL: http://neo4j:7474
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run ./scripts/setup-local.sh}
  RECOLLECT_CREDENTIAL_FILE: /var/lib/recollect/credentials.json
  RECOLLECT_ARTIFACT_DIR: /var/lib/recollect/artifacts
  RECOLLECT_ERASURE_JOURNAL: /var/lib/recollect/erasure-journal
  RECOLLECT_MCP_OUTBOX_DIR: /var/lib/recollect/artifacts/.mcp-receipts/central
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Unset keys are omitted. There is no built-in text model: each Brain's administrator selects one,
  # unless RECOLLECT_TEXT_MODEL names an explicit model for the whole installation.
  RECOLLECT_TEXT_MODEL:
  RECOLLECT_EMBEDDING_MODEL: ${RECOLLECT_EMBEDDING_MODEL:-text-embedding-3-large}
  RECOLLECT_EMBEDDING_DIMENSIONS: ${RECOLLECT_EMBEDDING_DIMENSIONS:-3072}
  # Unresolved keys are omitted, so unconfigured OIDC stays disabled.
  RECOLLECT_OIDC_ISSUER:
  RECOLLECT_OIDC_CLIENT_ID:
  RECOLLECT_OIDC_CLIENT_SECRET:
  RECOLLECT_OIDC_SCOPES:

x-app: &app
  image: recollect-dev:local
  build:
    context: .
  user: "${RECOLLECT_LOCAL_UID:?Run ./scripts/setup-local.sh}:${RECOLLECT_LOCAL_GID:?Run ./scripts/setup-local.sh}"
  volumes:
    - ./.data/runtime:/var/lib/recollect
    - ${RECOLLECT_ARTIFACT_DIR:-./.data/artifacts}:/var/lib/recollect/artifacts
    - ${RECOLLECT_ERASURE_JOURNAL:-./.data/erasure-journal}:/var/lib/recollect/erasure-journal
  environment: *runtime

services:
  postgres:
    environment:
      POSTGRES_USER: recollect_admin
      POSTGRES_DB: recollect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup-local.sh}
      RECOLLECT_DB_PASSWORD: ${RECOLLECT_DB_PASSWORD:?Run ./scripts/setup-local.sh}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/recollect.sh:ro
    healthcheck:
      interval: 3s
  neo4j:
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Run ./scripts/setup-local.sh}"
    ports:
      - "127.0.0.1:57474:7474"
    volumes:
      - ./.data/neo4j/data:/data
      - ./.data/neo4j/logs:/logs
      - ./.data/neo4j/plugins:/plugins
  migrate:
    <<: *app
    environment:
      <<: *runtime
      DATABASE_ADMIN_URL: postgres://recollect_admin:${POSTGRES_PASSWORD:?Run ./scripts/setup-local.sh}@postgres:5432/recollect
  api:
    <<: *app
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      interval: 10s
      retries: 6
  worker:
    <<: *app
volumes:
  postgres_data:
