[package]
name = "recollect-mcp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures = "0.3"
http = "1"
jsonschema = { version = "0.57", default-features = false }
keyring = "4"
process-wrap = { version = "10", features = ["tokio1"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
recollect-protocol.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sse-stream = "0.2.4"
tokio.workspace = true
tracing.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user"] }

[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }

[[example]]
name = "mcp-fixture"
path = "tests/fixtures/mcp.rs"
