[package]
name = "recollect-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
jsonschema = { version = "0.57", default-features = false }
axum.workspace = true
chrono.workspace = true
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
recollect-protocol.workspace = true
recollect-mcp-runtime = { path = "../mcp-runtime" }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
recollect-agent = { path = "../agent" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
