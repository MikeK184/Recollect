[package]
name = "recollect-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pre-1.0 A2A SDK; the Agent Card and message binding were verified against exactly 0.4.2
# (docs/mappings/agent-coordination-a2a-research-2026-10-18.md).
a2a = { package = "a2a-lf", version = "=0.4.2" }
futures-util = "0.3"
anyhow.workspace = true
jsonschema = { version = "0.57", default-features = false }
axum.workspace = true
chrono.workspace = true
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
recollect-protocol.workspace = true
recollect-mcp-runtime = { path = "../mcp-runtime" }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
subtle = "2"
# Argon2id password hashing (ADR 0024).
argon2 = "0.6"

[dev-dependencies]
recollect-agent = { path = "../agent" }
# Paused-clock tests of the per-Brain maintenance budgets.
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
