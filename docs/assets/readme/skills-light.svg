<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Dynamic skills: a skill published once in the Brain syncs as a native skill into Claude Code, Codex and OpenCode, which reload it.">
