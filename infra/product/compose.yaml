# Installation-agnostic service definitions shared by every Recollect stack.
# Layer one of these on top, with the same project directory:
#   - installation.yaml + personal.yaml|shared.yaml: named installations (scripts/install.py)
#   - ../../compose.yaml: the repository development stack (scripts/stack.sh)
# Relative paths and secrets belong in the layers, never here.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  image: ${RECOLLECT_IMAGE:-recollect-product:local}
  build:
    dockerfile: infra/product/Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  stop_signal: SIGTERM
  stop_grace_period: 90s
  pids_limit: 256
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U recollect_admin -d recollect -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: ${RECOLLECT_POSTGRES_MEMORY:-1g}
    cpus: ${RECOLLECT_POSTGRES_CPUS:-2}
    # Docker's 64 MB /dev/shm made parallel queries fail with SQLSTATE 53100
    # ("could not resize shared memory segment"); the pool then timed out.
    shm_size: 256m
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 90s
    logging: *logging
  neo4j:
    image: neo4j:2026.08@sha256:d8f4c156caa3af76499134947deb11d13042e471d9733060449f2a01eb7a248e
    environment:
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    mem_limit: ${RECOLLECT_GRAPH_MEMORY:-3g}
    cpus: ${RECOLLECT_GRAPH_CPUS:-2}
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 90s
    logging: *logging
  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1
    restart: "no"
  api:
    <<: *app
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10", "http://127.0.0.1:8787/health/ready"]
      interval: 15s
      timeout: 12s
      retries: 4
      start_period: 20s
    mem_limit: ${RECOLLECT_API_MEMORY:-1g}
    cpus: ${RECOLLECT_API_CPUS:-2}
    restart: unless-stopped
  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: ${RECOLLECT_WORKER_MEMORY:-2g}
    cpus: ${RECOLLECT_WORKER_CPUS:-4}
    restart: unless-stopped
